<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NATKIE FAQ 常见问题 / Frequently Asked Questions</title>
<style>
  :root {
    --bg: #0f0f0f;
    --panel: #171717;
    --panel-2: #1f1f1f;
    --border: #2c2c2c;
    --accent: #FF6A00;
    --accent-dim: #7a3300;
    --text: #f2f2f0;
    --text-dim: #9a9a95;
    --text-faint: #666660;
    --success: #3ecf8e;
    --danger: #e5484d;
    --radius: 10px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 18px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .mark { width: 10px; height: 10px; border-radius: 2px; background: var(--accent); display: inline-block; }
  .brand h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; margin: 0; }
  .brand span.sub { color: var(--text-dim); font-size: 12.5px; }
  .topbar-right { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .lang-toggle { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: var(--panel-2); }
  .lang-toggle button { border: none; background: transparent; color: var(--text-dim); padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .lang-toggle button.active { background: var(--accent); color: #101010; }
  input[type=text], input[type=search] {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 12px; font-size: 13.5px; font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); }
  .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn:hover { border-color: #444; }
  .btn-ghost { background: transparent; color: var(--text-dim); }
  .btn-ghost:hover { color: var(--text); }
  .config-bar {
    padding: 8px 24px; background: #141414; border-bottom: 1px solid var(--border);
    display: none; gap: 10px; align-items: center; font-size: 12.5px;
  }
  .config-bar.visible { display: flex; }
  .config-bar input { flex: 1; min-width: 240px; }
  .status-line { padding: 6px 24px; font-size: 11.5px; color: var(--text-faint); display: flex; gap: 8px; align-items: center; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); display: inline-block; }
  .status-dot.ok { background: var(--success); }
  .status-dot.err { background: var(--danger); }
  .hero {
    padding: 32px 24px 8px;
    max-width: 900px;
    margin: 0 auto;
  }
  .hero h2 { font-size: 22px; margin: 0 0 6px 0; }
  .hero p { color: var(--text-dim); font-size: 13.5px; margin: 0 0 18px 0; }
  .search-wrap { position: relative; max-width: 480px; }
  .search-wrap input { width: 100%; padding: 11px 14px 11px 36px; font-size: 14px; }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    font-size: 13px; opacity: 0.5;
  }
  .layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 0;
    max-width: 1100px;
    margin: 0 auto;
  }
  .sidebar { padding: 16px 10px 60px; }
  .sidebar .cat-item {
    display: flex; justify-content: space-between; padding: 9px 12px; border-radius: 8px;
    cursor: pointer; font-size: 13.5px; color: var(--text-dim); margin-bottom: 2px;
  }
  .sidebar .cat-item:hover { background: var(--panel-2); color: var(--text); }
  .sidebar .cat-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; }
  .sidebar .cat-count { color: var(--text-faint); font-size: 12px; }
  .main { padding: 16px 24px 60px; }
  .main-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .main-header h3 { font-size: 15px; margin: 0; color: var(--text-dim); font-weight: 600; }
  .qa-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .qa-question-row {
    padding: 15px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .qa-question-row:hover { background: var(--panel-2); }
  .qa-question {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    margin: 0;
  }
  .qa-chevron {
    color: var(--text-faint);
    font-size: 12px;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }
  .qa-card.open .qa-chevron { transform: rotate(90deg); color: var(--accent); }
  .qa-answer-wrap {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
  }
  .qa-card.open .qa-answer-wrap { max-height: 800px; }
  .qa-answer {
    padding: 0 18px 16px 18px;
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.65;
    white-space: pre-wrap;
  }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-faint); }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { display: flex; overflow-x: auto; gap: 6px; padding: 12px 16px; white-space: nowrap; }
    .sidebar .cat-item { flex-shrink: 0; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <span class="mark"></span>
    <h1>NATKIE</h1>
    <span class="sub" data-i18n-sub>常见问题解答</span>
  </div>
  <div class="topbar-right">
    <div class="lang-toggle">
      <button id="langZh" class="active" onclick="setLang('zh')">中文</button>
      <button id="langEn" onclick="setLang('en')">EN</button>
    </div>
  </div>
</div>
<div class="status-line">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText"></span>
</div>
<div class="hero">
  <h2 data-i18n="heroTitle">有什么可以帮您？</h2>
  <p data-i18n="heroSub">搜索或浏览下方分类，查找关于 NATKIE 电动越野摩托车的常见问题</p>
  <div class="search-wrap">
    <input type="search" id="searchBox" placeholder="搜索问题…" oninput="renderList()" data-i18n-placeholder="searchPlaceholder">
  </div>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="main-header">
      <h3 id="currentCatTitle" data-i18n="allCategories">全部分类</h3>
    </div>
    <div id="qaList"></div>
  </div>
</div>
<script>
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwBGqjej8nruqjSeyavx7ahCDCXoY_XbofjnPWR-ollOx9QWWXVmW3Q7m1ecZKhv2Mc/exec';
const AUTO_REFRESH_MS = 60000;
const I18N = {
  zh: {
    sub: '常见问题解答',
    heroTitle: '有什么可以帮您？',
    heroSub: '搜索或浏览下方分类，查找关于 NATKIE 电动越野摩托车的常见问题',
    searchPlaceholder: '搜索问题…',
    allCategories: '全部分类',
    noResults: '没有找到匹配的问题，换个关键词试试',
    loading: '加载中…',
    loadFailed: '加载失败，请检查数据来源地址',
    connected: '内容已与后台同步',
    lastSync: '上次同步：'
  },
  en: {
    sub: 'Frequently Asked Questions',
    heroTitle: 'How can we help?',
    heroSub: 'Search or browse the categories below to find answers about NATKIE electric dirt bikes',
    searchPlaceholder: 'Search questions…',
    allCategories: 'All Categories',
    noResults: 'No matching questions — try a different search',
    loading: 'Loading…',
    loadFailed: 'Failed to load — check the data source URL',
    connected: 'Synced with backend',
    lastSync: 'Last synced: '
  }
};
let lang = 'zh', allData = [], categories = [], activeCategory = null, apiUrl = DEFAULT_API_URL, openCardId = null;
function t(key) { return I18N[lang][key] || key; }
function setLang(l) {
  lang = l;
  document.getElementById('langZh').classList.toggle('active', l === 'zh');
  document.getElementById('langEn').classList.toggle('active', l === 'en');
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-sub]').forEach(el => el.textContent = t('sub'));
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.getAttribute('data-i18n-placeholder')));
  document.getElementById('currentCatTitle').textContent = activeCategory ? (lang === 'zh' ? activeCategory.zh : activeCategory.en) : t('allCategories');
  renderSidebar();
  renderList();
}
function setStatus(state, extraText) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (state === 'ok' ? ' ok' : state === 'err' ? ' err' : '');
  const txt = document.getElementById('statusText');
  if (state === 'ok') {
    const now = new Date();
    txt.textContent = t('connected') + ' · ' + t('lastSync') + now.toLocaleTimeString(lang === 'zh' ? 'zh-CN' : 'en-US');
  } else if (extraText) {
    txt.textContent = extraText;
  }
}
async function loadData(isBackground) {
  if (!apiUrl) {
    document.getElementById('qaList').innerHTML = '<div class="empty-state">' + t('loading') + '</div>';
    return;
  }
  if (!isBackground) {
    document.getElementById('qaList').innerHTML = '<div class="empty-state">' + t('loading') + '</div>';
  }
  try {
    const res = await fetch(apiUrl + '?action=list', { cache: 'no-store' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'unknown error');
    allData = json.data;
    buildCategories();
    renderSidebar();
    renderList();
    setStatus('ok');
  } catch (err) {
    setStatus('err', t('loadFailed'));
    if (!isBackground) {
      document.getElementById('qaList').innerHTML = '<div class="empty-state">' + t('loadFailed') + '</div>';
    }
  }
}
function buildCategories() {
  const map = {};
  allData.forEach(item => {
    if (!map[item.cat_order]) map[item.cat_order] = { order: item.cat_order, zh: item.category_zh, en: item.category_en, count: 0 };
    map[item.cat_order].count++;
  });
  categories = Object.values(map).sort((a, b) => a.order - b.order);
}
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '<div class="cat-item' + (activeCategory === null ? ' active' : '') + '" onclick="selectCategory(null)"><span>' + t('allCategories') + '</span><span class="cat-count">' + allData.length + '</span></div>';
  categories.forEach(c => {
    const label = lang === 'zh' ? c.zh : c.en;
    const isActive = activeCategory && activeCategory.order === c.order;
    html += '<div class="cat-item' + (isActive ? ' active' : '') + '" onclick="selectCategoryByOrder(' + c.order + ')"><span>' + c.order + '. ' + escapeHtml(label) + '</span><span class="cat-count">' + c.count + '</span></div>';
  });
  sb.innerHTML = html;
}
function selectCategory(cat) {
  activeCategory = cat;
  document.getElementById('currentCatTitle').textContent = cat ? (lang === 'zh' ? cat.zh : cat.en) : t('allCategories');
  renderSidebar();
  renderList();
}
function selectCategoryByOrder(order) {
  selectCategory(categories.find(c => c.order === order));
}
function toggleCard(id) {
  openCardId = (openCardId === id) ? null : id;
  renderList();
}
function renderList() {
  const listEl = document.getElementById('qaList');
  const q = (document.getElementById('searchBox').value || '').toLowerCase();
  let items = allData;
  if (activeCategory) items = items.filter(i => i.cat_order === activeCategory.order);
  if (q) {
    items = items.filter(i => (i.question_zh + i.question_en + i.answer_zh + i.answer_en).toLowerCase().indexOf(q) !== -1);
  }
  if (items.length === 0) {
    listEl.innerHTML = '<div class="empty-state">' + (allData.length === 0 ? t('loading') : t('noResults')) + '</div>';
    return;
  }
  listEl.innerHTML = items.map(item => {
    const question = lang === 'zh' ? item.question_zh : item.question_en;
    const answer = lang === 'zh' ? item.answer_zh : item.answer_en;
    const isOpen = openCardId === item.id;
    return '<div class="qa-card' + (isOpen ? ' open' : '') + '"><div class="qa-question-row" onclick="toggleCard(' + item.id + ')"><p class="qa-question">' + escapeHtml(question) + '</p><span class="qa-chevron">▶</span></div><div class="qa-answer-wrap"><div class="qa-answer">' + escapeHtml(answer) + '</div></div></div>';
  }).join('');
}
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
(async function init() {
  await loadData();
  setInterval(() => loadData(true), AUTO_REFRESH_MS);
})();
</script>
</body>
</html>
